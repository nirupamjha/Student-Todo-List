<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student To-Do List</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 15px; font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
    .container { max-width: 760px; margin: 20px auto; padding: 26px; background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(15,23,42,.08); }
    h1 { margin: 0 0 7px; text-align: center; color: #2563eb; }
    .subtitle, #today { text-align: center; color: #64748b; }
    .subtitle { margin: 0 0 8px; } #today { margin-bottom: 23px; font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 155px 155px; gap: 10px; }
    input, select { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; font-size: 14px; color: #1e293b; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; cursor: pointer; color: white; background: #2563eb; font-size: 13px; }
    button:hover { opacity: .88; } .add-button { width: 100%; margin-top: 10px; }
    #message { min-height: 18px; color: #dc2626; font-size: 13px; margin: 9px 0; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 17px 0; }
    .stat { background: #eff6ff; border-radius: 9px; padding: 13px; text-align: center; }
    .stat strong { display: block; color: #2563eb; font-size: 22px; margin-top: 4px; }
    .progress-wrap { margin: 16px 0 20px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; margin-bottom: 7px; }
    .progress-track { height: 9px; background: #e2e8f0; border-radius: 20px; overflow: hidden; }
    #progressBar { height: 100%; width: 0; background: #16a34a; transition: width .2s; }
    .toolbar { display: flex; gap: 10px; margin: 15px 0; } .toolbar input { flex: 1; } .toolbar select { width: 165px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px; margin-bottom: 10px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 9px; }
    .task-info { min-width: 0; overflow-wrap: anywhere; } .task-name { font-weight: 600; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; font-size: 12px; color: #64748b; }
    .tag { padding: 3px 7px; border-radius: 20px; background: #e2e8f0; }
    .due-soon { background: #fef3c7; color: #92400e; } .overdue { background: #fee2e2; color: #b91c1c; }
    .done .task-name { text-decoration: line-through; color: #16a34a; }
    .actions { display: flex; gap: 7px; flex-shrink: 0; } .complete { background: #16a34a; } .edit { background: #64748b; } .delete { background: #dc2626; }
    .empty { text-align: center; color: #94a3b8; padding: 22px 8px; }
    @media (max-width: 620px) {
      .form-grid { grid-template-columns: 1fr 1fr; } .form-grid input { grid-column: 1 / -1; }
      .toolbar { flex-direction: column; } .toolbar select { width: 100%; }
      li { align-items: flex-start; flex-direction: column; } .actions { align-self: flex-end; }
      .container { padding: 19px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Student To-Do List</h1>
    <p class="subtitle">Organise your studies, one task at a time.</p>
    <div id="today"></div>

    <div class="form-grid">
      <input id="taskInput" type="text" placeholder="Enter your task...">
      <input id="dueDateInput" type="date" aria-label="Due date">
    </div>
    <button class="add-button" id="addButton" onclick="addTask()">+ Add Task</button>
    <p id="message"></p>

    <section class="stats">
      <div class="stat">Total Tasks<strong id="total">0</strong></div>
      <div class="stat">Completed<strong id="completed">0</strong></div>
      <div class="stat">Pending<strong id="pending">0</strong></div>
    </section>

    <div class="progress-wrap">
      <div class="progress-label"><span>Overall progress</span><span id="progressText">0%</span></div>
      <div class="progress-track"><div id="progressBar"></div></div>
    </div>

    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Search your tasks..." oninput="renderTasks()">
      <select id="filterInput" onchange="renderTasks()">
        <option value="All">All tasks</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="Overdue">Overdue</option>
      </select>
    </div>
    <ul id="taskList"></ul>
  </main>

  <script>
    // JavaScript Objects: each task is stored as an object.
    let tasks = JSON.parse(localStorage.getItem("studentTasks")) || [];
    let nextId = tasks.length ? Math.max(...tasks.map(task => task.id)) + 1 : 1;
    let editingId = null;

    // Date Object: display today's date.
    document.getElementById("today").textContent =
      "Today: " + new Date().toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });

    // User-defined validation function.
    function validateTask(taskName, dueDate) {
      if (taskName.trim() === "") return "Please enter a task.";
      if (taskName.trim().length < 3) return "Task must contain at least 3 characters.";
      if (taskName.trim().length > 80) return "Task must be less than 80 characters.";
      if (dueDate && dueDate < new Date().toLocaleDateString("en-CA")) {
        return "Due date cannot be in the past.";
      }
      return "";
    }

    function saveTasks() {
      localStorage.setItem("studentTasks", JSON.stringify(tasks));
    }

    function resetForm() {
      document.getElementById("taskInput").value = "";
      document.getElementById("dueDateInput").value = "";
      document.getElementById("addButton").textContent = "+ Add Task";
      editingId = null;
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const dueDate = document.getElementById("dueDateInput").value;
      const error = validateTask(input.value, dueDate);
      document.getElementById("message").textContent = error;
      if (error) return;

      if (editingId !== null) {
        const task = tasks.find(item => item.id === editingId);
        if (task) {
          task.name = input.value.trim();
          task.dueDate = dueDate;
        }
      } else {
        tasks.push({
          id: nextId++,
          name: input.value.trim(),
          dueDate: dueDate,
          completed: false,
          createdAt: new Date().toISOString()
        });
      }

      resetForm();
      document.getElementById("message").textContent = "";
      saveTasks();
      renderTasks();
    }

    function editTask(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      document.getElementById("taskInput").value = task.name;
      document.getElementById("dueDateInput").value = task.dueDate || "";
      document.getElementById("addButton").textContent = "Save Changes";
      editingId = id;
      document.getElementById("taskInput").focus();
    }

    function toggleTask(id) {
      const task = tasks.find(item => item.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(item => item.id !== id);
      if (editingId === id) resetForm();
      saveTasks();
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById("taskList");
      const searchText = document.getElementById("searchInput").value.toLowerCase();
      const filter = document.getElementById("filterInput").value;
      const today = new Date().toLocaleDateString("en-CA");
      list.innerHTML = "";

      const visibleTasks = tasks.filter(task => {
        const matchesSearch = task.name.toLowerCase().includes(searchText);
        const isOverdue = task.dueDate && task.dueDate < today && !task.completed;
        const matchesFilter = filter === "All" ||
          (filter === "Completed" && task.completed) ||
          (filter === "Pending" && !task.completed) ||
          (filter === "Overdue" && isOverdue);
        return matchesSearch && matchesFilter;
      });

      if (visibleTasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = tasks.length ? "No matching tasks found." : "No tasks yet. Add your first task above!";
        list.appendChild(empty);
      }

      visibleTasks.forEach(task => {
        const li = document.createElement("li");
        const info = document.createElement("div");
        info.className = "task-info" + (task.completed ? " done" : "");

        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = task.name;

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const created = document.createElement("span");
        created.className = "tag";
        created.textContent = "Added: " + new Date(task.createdAt).toLocaleDateString();

        meta.appendChild(created);

        if (task.dueDate) {
          const due = document.createElement("span");
          const overdue = task.dueDate < today && !task.completed;
          due.className = "tag " + (overdue ? "overdue" : "due-soon");
          due.textContent = (overdue ? "Overdue: " : "Due: ") +
            new Date(task.dueDate + "T00:00:00").toLocaleDateString();
          meta.appendChild(due);
        }

        info.append(name, meta);

        const actions = document.createElement("div");
        actions.className = "actions";

        const completeButton = document.createElement("button");
        completeButton.className = "complete";
        completeButton.textContent = task.completed ? "Undo" : "Complete";
        completeButton.onclick = () => toggleTask(task.id);

        const editButton = document.createElement("button");
        editButton.className = "edit";
        editButton.textContent = "Edit";
        editButton.onclick = () => editTask(task.id);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Delete";
        deleteButton.onclick = () => deleteTask(task.id);

        actions.append(completeButton, editButton, deleteButton);
        li.append(info, actions);
        list.appendChild(li);
      });

      const completedCount = tasks.filter(task => task.completed).length;
      const percentage = tasks.length ? Math.round((completedCount / tasks.length) * 100) : 0;
      document.getElementById("total").textContent = tasks.length;
      document.getElementById("completed").textContent = completedCount;
      document.getElementById("pending").textContent = tasks.length - completedCount;
      document.getElementById("progressText").textContent = percentage + "%";
      document.getElementById("progressBar").style.width = percentage + "%";
    }

    document.getElementById("taskInput").addEventListener("keydown", event => {
      if (event.key === "Enter") addTask();
    });

    renderTasks();
  </script>
</body>
</html>
